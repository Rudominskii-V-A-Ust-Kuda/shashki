<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Checkers Royale: 2026</title>
<style>
    :root {
        --bg: #0a0f18; --panel: rgba(20, 30, 50, 0.7);
        --gold: #ffd166; --purple: #b12dff; --blue: #4dabf7; --red: #ff3b3b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
    canvas { position: absolute; inset: 0; display: block; }
    
    /* UI Overlay */
    #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    
    /* Top HUD */
    .top-hud { display: flex; justify-content: space-between; padding: 15px; pointer-events: none; }
    .enemy-info, .player-info { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 12px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .enemy-info h3, .player-info h3 { font-size: 14px; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .hp-bar { width: 120px; height: 8px; background: #000; border-radius: 4px; overflow: hidden; margin-top: 5px; border: 1px solid #333; }
    .hp-fill { height: 100%; background: linear-gradient(90deg, var(--red), #ff8855); width: 100%; transition: width 0.3s; }

    /* Bottom UI */
    .bottom-hud { padding: 10px 15px 25px; display: flex; flex-direction: column; align-items: center; pointer-events: auto; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
    
    /* Elixir Bar */
    .elixir-container { width: 100%; max-width: 400px; margin-bottom: 15px; position: relative; }
    .elixir-bg { width: 100%; height: 20px; background: #111; border-radius: 10px; border: 2px solid #444; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
    .elixir-fill { height: 100%; background: linear-gradient(90deg, #ff00cc, #333399); width: 50%; transition: width 0.1s linear; box-shadow: 0 0 10px #ff00cc; }
    .elixir-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 1px 2px #000; }

    /* Cards */
    .cards { display: flex; gap: 8px; justify-content: center; width: 100%; max-width: 400px; }
    .card { width: 75px; height: 95px; background: linear-gradient(180deg, #2a3a5a, #1a2a4a); border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.6); transition: transform 0.1s, filter 0.2s; cursor: grab; touch-action: none; }
    .card:active { cursor: grabbing; transform: scale(0.95); }
    .card.disabled { filter: grayscale(1) brightness(0.5); pointer-events: none; }
    .card .cost { position: absolute; top: -5px; left: -5px; width: 24px; height: 24px; background: radial-gradient(circle, #ff5ce6, #b12dff); border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .card .icon { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .card .name { font-size: 10px; color: #ccc; margin-top: 5px; text-transform: uppercase; font-weight: bold; }

    /* Overlays */
    #menu { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; opacity: 1; transition: opacity 0.5s; }
    #menu.hidden { opacity: 0; pointer-events: none; }
    #menu h1 { color: #fff; font-size: 36px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px var(--gold); margin-bottom: 10px; }
    #menu p { color: #aaa; margin-bottom: 40px; text-align: center; max-width: 300px; line-height: 1.5; }
    .btn { padding: 15px 40px; margin: 10px; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; width: 250px; color: #fff; }
    .btn:active { transform: scale(0.95); }
    .btn-friendly { background: linear-gradient(45deg, #4dabf7, #3b5bdb); box-shadow: 0 5px 15px rgba(77, 171, 247, 0.4); }
    .btn-ranked { background: linear-gradient(45deg, #ff3b3b, #c81a00); box-shadow: 0 5px 15px rgba(255, 59, 59, 0.4); }
    
    /* Drag Proxy */
    #drag-proxy { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 30px; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); border: 2px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div class="top-hud">
        <div class="enemy-info">
            <h3 id="enemyName">Enemy AI</h3>
            <div>Эликсир: <span id="enemyElixir">0</span></div>
            <div class="hp-bar"><div class="hp-fill" id="enemyHp"></div></div>
        </div>
        <div class="player-info">
            <h3>Вы</h3>
            <div>Рейтинг: <span id="rankText">0</span></div>
            <div class="hp-bar"><div class="hp-fill" id="playerHp" style="background: linear-gradient(90deg, #4dabf7, #15aabf)"></div></div>
        </div>
    </div>

    <div class="bottom-hud">
        <div class="elixir-container">
            <div class="elixir-bg"><div class="elixir-fill" id="elixirFill"></div></div>
            <div class="elixir-text" id="elixirText">5 / 10</div>
        </div>
        <div class="cards" id="handContainer"></div>
    </div>
</div>

<div id="drag-proxy">🛡️</div>

<div id="menu">
    <h1>Checkers Royale</h1>
    <p>Слияние классических шашек и карточной стратегии. Используй эликсир, вытягивай карты на доску и уничтожь башню врага!</p>
    <button class="btn btn-friendly" onclick="startGame('friendly')">Дружеский матч</button>
    <button class="btn btn-ranked" onclick="startGame('ranked')">Рейтинговый матч</button>
</div>

<script>
'use strict';

// ==========================================
// 1. КОНСТАНТЫ И КОНФИГУРАЦИЯ
// ==========================================
const CFG = {
    maxElixir: 10,
    elixirRegenTime: 1.5, // секунд на 1 единицу
    gridSize: 8,
    cardNames: { knight: 'Рыцарь', bomber: 'Бомбист', sniper: 'Снайпер', mage: 'Маг' }
};

const CARDS = {
    knight: { cost: 3, icon: '🛡️', color: '#a8c0e0', hp: 3, dmg: 1, type: 'melee' },
    bomber: { cost: 4, icon: '💣', color: '#ff6b6b', hp: 1, dmg: 3, type: 'ranged', aoe: true },
    sniper: { cost: 5, icon: '🎯', color: '#4dabf7', hp: 1, dmg: 4, type: 'ranged' },
    mage:   { cost: 4, icon: '🔮', color: '#b197fc', hp: 2, dmg: 2, type: 'ranged' }
};

const BIOME = {
    sky1: '#0f172a', sky2: '#1e293b',
    ground1: '#334155', ground2: '#0f172a',
    tileA: '#475569', tileB: '#1e293b',
    glow: '#38bdf8'
};

// ==========================================
// 2. ЯДРО (Canvas, Math, Utilities)
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, CS, BX, BY, BOARD;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Адаптивная доска
    const maxBoardSize = Math.min(W * 0.95, H * 0.55);
    CS = Math.floor(maxBoardSize / CFG.gridSize);
    BOARD = CS * CFG.gridSize;
    BX = (W - BOARD) / 2;
    BY = H * 0.15;
}
window.addEventListener('resize', resize);
resize();

const lerp = (a, b, t) => a + (b - a) * t;
const rand = (min, max) => Math.random() * (max - min) + min;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const cellToXY = (r, c) => ({ x: BX + c * CS + CS / 2, y: BY + r * CS + CS / 2 });
const xyToCell = (x, y) => ({ r: Math.floor((y - BY) / CS), c: Math.floor((x - BX) / CS) });

// ==========================================
// 3. СИСТЕМА ЧАСТИЦ И ЭФФЕКТОВ (VFX)
// ==========================================
class Particle {
    constructor(x, y, color, speed, life, size) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const velocity = rand(speed * 0.5, speed);
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.color = color;
        this.life = life; this.maxLife = life;
        this.size = rand(size * 0.5, size);
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 300 * dt; // гравитация
        this.life -= dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Projectile {
    constructor(x, y, tx, ty, color, target) {
        this.x = x; this.y = y; this.tx = tx; this.ty = ty;
        this.color = color; this.target = target;
        this.t = 0; this.dur = dist(x, y, tx, ty) / 800;
    }
    update(dt) {
        this.t += dt;
        return this.t >= this.dur;
    }
    draw(ctx) {
        const k = Math.min(1, this.t / this.dur);
        const cx = lerp(this.x, this.tx, k);
        const cy = lerp(this.y, this.ty, k);
        
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(cx, cy, CS * 0.1, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(cx, cy, CS * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.t = 0; this.dur = 1.0;
    }
    update(dt) { this.t += dt; this.y -= 50 * dt; return this.t >= this.dur; }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, 1 - this.t / this.dur);
        ctx.fillStyle = this.color;
        ctx.font = 'bold 20px Segoe UI';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

// ==========================================
// 4. ИГРОВЫЕ СУЩНОСТИ
// ==========================================
class Checker {
    constructor(r, c, side, cardType, level = 1) {
        this.r = r; this.c = c;
        this.side = side; // 'player' | 'enemy'
        this.cardType = cardType;
        this.level = level;
        this.maxHp = CARDS[cardType].hp + (level - 1) * 2;
        this.hp = this.maxHp;
        this.isBoss = false;
        this.moveCooldown = 0;
        
        const target = cellToXY(r, c);
        this.x = target.x; this.y = target.y;
        this.bobOffset = Math.random() * Math.PI * 2;
    }
    update(dt) {
        this.moveCooldown = Math.max(0, this.moveCooldown - dt);
        const target = cellToXY(this.r, this.c);
        this.x = lerp(this.x, target.x, dt * 10);
        this.y = lerp(this.y, target.y, dt * 10);
    }
    draw(ctx, time) {
        const isFlying = this.level >= 3;
        const bob = isFlying ? Math.sin(time * 5 + this.bobOffset) * 5 - 10 : 0;
        
        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + CS * 0.3, CS * 0.4, CS * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Сама шашка (многослойная для уровней)
        for (let i = 0; i < Math.min(this.level, 4); i++) {
            const yOffset = -i * CS * 0.15 + bob;
            const radius = CS * 0.35 * (1 - i * 0.08);
            
            // 3D Градиент
            const grad = ctx.createRadialGradient(
                this.x - radius * 0.3, this.y + yOffset - radius * 0.3, radius * 0.1,
                this.x, this.y + yOffset, radius
            );
            
            if (this.side === 'player') {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, CARDS[this.cardType].color);
                grad.addColorStop(1, '#1e293b');
            } else {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#ef4444');
                grad.addColorStop(1, '#450a0a');
            }
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y + yOffset, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Обводка
            ctx.strokeStyle = this.side === 'player' ? '#38bdf8' : '#f87171';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Блик
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(this.x - radius*0.3, this.y + yOffset - radius*0.3, radius*0.2, 0, Math.PI*2);
            ctx.fill();
        }
        
        // Иконка карты
        if (this.cardType) {
            ctx.font = `${Math.floor(CS*0.4)}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(CARDS[this.cardType].icon, this.x, this.y + bob - CS*0.1);
        }
        
        // Полоска HP
        if (this.hp < this.maxHp) {
            const w = CS * 0.8;
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x - w/2, this.y - CS*0.5 + bob, w, 5);
            ctx.fillStyle = '#10b981';
            ctx.fillRect(this.x - w/2, this.y - CS*0.5 + bob, w * (this.hp / this.maxHp), 5);
        }
    }
}

class BossTower {
    constructor(r, c, side) {
        this.r = r; this.c = c; this.side = side;
        this.maxHp = 30; this.hp = 30;
        const target = cellToXY(r, c);
        this.x = target.x; this.y = target.y - CS*0.5;
        this.fireCd = 0;
    }
    update(dt) {
        this.fireCd = Math.max(0, this.fireCd - dt);
    }
    draw(ctx, time) {
        // Огромная башня
        const size = CS * 1.2;
        const grad = ctx.createLinearGradient(this.x, this.y - size, this.x, this.y + size/2);
        grad.addColorStop(0, this.side === 'player' ? '#60a5fa' : '#f87171');
        grad.addColorStop(1, '#0f172a');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(this.x - size/2, this.y + size/2);
        ctx.lineTo(this.x - size/3, this.y - size/2);
        ctx.lineTo(this.x + size/3, this.y - size/2);
        ctx.lineTo(this.x + size/2, this.y + size/2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        
        // Корона
        ctx.fillStyle = '#fbbf24';
        ctx.font = `${Math.floor(CS*0.8)}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('👑', this.x, this.y - size/2);
        
        // HP Bar
        const w = CS * 1.5;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(this.x - w/2, this.y - size/1.5 - 20, w, 10);
        ctx.fillStyle = this.hp > 10 ? '#10b981' : '#ef4444';
        ctx.fillRect(this.x - w/2, this.y - size/1.5 - 20, w * (this.hp / this.maxHp), 10);
    }
}

// ==========================================
// 5. ИГРОВАЯ ЛОГИКА
// ==========================================
const Game = {
    mode: 'friendly',
    rating: 1200,
    isRunning: false,
    time: 0,
    elixir: 5,
    enemyElixir: 5,
    board: [],
    playerHand: [],
    enemyHand: [],
    projectiles: [],
    particles: [],
    floaters: [],
    
    init(mode) {
        this.mode = mode;
        this.isRunning = true;
        this.time = 0;
        this.elixir = 5;
        this.enemyElixir = 5;
        this.board = Array(8).fill(null).map(() => Array(8).fill(null));
        this.projectiles = []; this.particles = []; this.floaters = [];
        
        // Базы
        this.playerBase = new BossTower(7, 3, 'player');
        this.enemyBase = new BossTower(0, 3, 'enemy');
        this.board[7][3] = this.playerBase;
        this.board[0][3] = this.enemyBase;
        
        // Стартовые враги (шашки)
        for (let c = 0; c < 8; c += 2) {
            this.spawnChecker(2, c, 'enemy', 'knight', 1);
        }
        
        // Карты в руку
        this.playerHand = ['knight', 'sniper', 'bomber', 'mage'];
        this.enemyHand = ['knight', 'knight', 'mage', 'bomber'];
        
        this.renderHand();
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('rankText').innerText = this.rating;
        document.getElementById('enemyName').innerText = mode === 'ranked' ? 'Grandmaster AI' : 'Friendly Bot';
    },
    
    spawnChecker(r, c, side, type, level) {
        if (this.board[r][c]) return false;
        this.board[r][c] = new Checker(r, c, side, type, level);
        return true;
    },
    
    renderHand() {
        const container = document.getElementById('handContainer');
        container.innerHTML = '';
        this.playerHand.forEach((cardId, index) => {
            const card = CARDS[cardId];
            const div = document.createElement('div');
            div.className = 'card';
            if (this.elixir < card.cost) div.classList.add('disabled');
            div.innerHTML = `
                <div class="cost">${card.cost}</div>
                <div class="icon">${card.icon}</div>
                <div class="name">${CFG.cardNames[cardId]}</div>
            `;
            
            // Drag & Drop
            div.addEventListener('pointerdown', (e) => {
                if (this.elixir < card.cost || !this.isRunning) return;
                div.style.opacity = '0.3';
                document.getElementById('drag-proxy').innerText = card.icon;
                
                const moveProxy = (ev) => {
                    const proxy = document.getElementById('drag-proxy');
                    proxy.style.display = 'flex';
                    proxy.style.left = ev.clientX + 'px';
                    proxy.style.top = ev.clientY + 'px';
                };
                
                const upProxy = (ev) => {
                    document.removeEventListener('pointermove', moveProxy);
                    document.removeEventListener('pointerup', upProxy);
                    document.getElementById('drag-proxy').style.display = 'none';
                    div.style.opacity = '1';
                    
                    const cell = xyToCell(ev.clientX, ev.clientY);
                    if (cell.r >= 4 && cell.r < 8 && cell.c >= 0 && cell.c < 8) {
                        if (this.spawnChecker(cell.r, cell.c, 'player', cardId, 1)) {
                            this.elixir -= card.cost;
                            this.updateElixirUI();
                            this.renderHand();
                            this.createExplosion(cellToXY(cell.r, cell.c).x, cellToXY(cell.r, cell.c).y, card.color);
                        }
                    }
                };
                
                document.addEventListener('pointermove', moveProxy);
                document.addEventListener('pointerup', upProxy);
            });
            
            container.appendChild(div);
        });
    },
    
    updateElixirUI() {
        const pct = (this.elixir / CFG.maxElixir) * 100;
        document.getElementById('elixirFill').style.width = pct + '%';
        document.getElementById('elixirText').innerText = Math.floor(this.elixir) + ' / ' + CFG.maxElixir;
    },
    
    createExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            this.particles.push(new Particle(x, y, color, 200, 0.8, 4));
        }
    },
    
    // Логика шашек: поиск доступных ходов по диагонали
    getValidMoves(r, c) {
        const piece = this.board[r][c];
        if (!piece || piece.side !== 'player' || piece.isBoss) return [];
        
        let moves = [];
        const dirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]]; // 4 диагонали
        const maxStep = piece.level >= 3 ? 7 : 1; // Дамки летают
        
        for (let [dr, dc] of dirs) {
            for (let step = 1; step <= maxStep; step++) {
                const nr = r + dr * step;
                const nc = c + dc * step;
                
                if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;
                const target = this.board[nr][nc];
                
                if (!target) {
                    moves.push({ r: nr, c: nc, isCapture: false });
                } else {
                    // Атака (срубить)
                    if (target.side !== piece.side && !target.isBoss) {
                        const jr = nr + dr;
                        const jc = nc + dc;
                        if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8 && !this.board[jr][jc]) {
                            moves.push({ r: jr, c: jc, isCapture: true, tr: nr, tc: nc });
                        }
                    }
                    break; // Блокируется
                }
            }
        }
        return moves;
    },
    
    // ИИ Ход
    enemyTurn() {
        if (!this.isRunning) return;
        
        // 1. ИИ пытается походить шашками
        const enemyPieces = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.board[r][c] && this.board[r][c].side === 'enemy' && !this.board[r][c].isBoss) {
                    enemyPieces.push({ r, c, piece: this.board[r][c] });
                }
            }
        }
        
        if (enemyPieces.length > 0) {
            // Берем случайную шашку и двигаем вниз
            const { r, c, piece } = enemyPieces[Math.floor(Math.random() * enemyPieces.length)];
            const dirs = [[1, -1], [1, 1]];
            const [dr, dc] = dirs[Math.floor(Math.random() * 2)];
            const nr = r + dr;
            const nc = c + dc;
            
            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !this.board[nr][nc]) {
                this.board[nr][nc] = piece;
                this.board[r][c] = null;
                piece.r = nr; piece.c = nc;
            }
        }
        
        // 2. ИИ спавнит новую карту (если хватает эликсира)
        if (this.enemyElixir >= 4) {
            const freeCells = [];
            for (let c = 0; c < 8; c++) if (!this.board[1][c]) freeCells.push(c);
            if (freeCells.length > 0) {
                const c = freeCells[Math.floor(Math.random() * freeCells.length)];
                this.spawnChecker(1, c, 'enemy', 'knight', this.mode === 'ranked' ? 2 : 1);
                this.enemyElixir -= 4;
            }
        }
        
        // 3. Атака базы (если шашка дошла)
        const r = 7;
        for (let c = 0; c < 8; c++) {
            if (this.board[r][c] && this.board[r][c].side === 'enemy' && !this.board[r][c].isBoss) {
                this.playerBase.hp -= 2;
                this.board[r][c] = null; // Шашка "врезается" и исчезает
                this.createExplosion(this.playerBase.x, this.playerBase.y, '#ef4444');
                this.checkGameOver();
            }
        }
    },
    
    checkGameOver() {
        if (this.playerBase.hp <= 0) this.endGame(false);
        if (this.enemyBase.hp <= 0) this.endGame(true);
    },
    
    endGame(win) {
        this.isRunning = false;
        setTimeout(() => {
            if (this.mode === 'ranked') {
                this.rating += win ? 30 : -20;
            }
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('menu').querySelector('h1').innerText = win ? 'VICTORY!' : 'DEFEAT!';
        }, 2000);
    },

    update(dt) {
        if (!this.isRunning) return;
        this.time += dt;
        
        // Восстановление эликсира
        this.elixir = Math.min(CFG.maxElixir, this.elixir + dt / CFG.elixirRegenTime);
        this.enemyElixir = Math.min(CFG.maxElixir, this.enemyElixir + dt / CFG.elixirRegenTime);
        this.updateElixirUI();
        
        // Обновление UI карт (каждый кадр, чтобы проверять доступность)
        const cards = document.querySelectorAll('.card');
        if (cards.length) {
            this.playerHand.forEach((cardId, i) => {
                if (this.elixir < CARDS[cardId].cost) cards[i].classList.add('disabled');
                else cards[i].classList.remove('disabled');
            });
        }
        
        // Обновление сущностей
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.board[r][c]) this.board[r][c].update(dt);
            }
        }
        this.playerBase.update(dt);
        this.enemyBase.update(dt);
        
        // Стрельба башен по врагам
        if (this.playerBase.fireCd <= 0) {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    if (this.board[r][c] && this.board[r][c].side === 'enemy') {
                        this.projectiles.push(new Projectile(this.playerBase.x, this.playerBase.y - CS, this.board[r][c].x, this.board[r][c].y, '#38bdf8', this.board[r][c]));
                        this.playerBase.fireCd = 2.0; // стреляет раз в 2 секунды
                        break;
                    }
                }
            }
        }
        
        // Обновление снарядов
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            if (this.projectiles[i].update(dt)) {
                if (this.projectiles[i].target) {
                    this.projectiles[i].target.hp -= 1;
                    this.createExplosion(this.projectiles[i].tx, this.projectiles[i].ty, this.projectiles[i].color);
                    if (this.projectiles[i].target.hp <= 0) {
                        const t = this.projectiles[i].target;
                        this.board[t.r][t.c] = null;
                    }
                }
                this.projectiles.splice(i, 1);
            }
        }
        
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }
        
        // ИИ ходит раз в 2 секунды
        if (Math.floor(this.time * 10) % 20 === 0 && !this.aiCooldown) {
            this.aiCooldown = true;
            this.enemyTurn();
            setTimeout(() => this.aiCooldown = false, 1000);
        }
    },
    
    draw() {
        // Фон
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, BIOME.sky1); sky.addColorStop(1, BIOME.sky2);
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        
        // Доска (Неоморфная, 3D)
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.roundRect(BX - 15, BY - 15, BOARD + 30, BOARD + 30, 20);
        ctx.fill();
        
        // Клетки
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const isDark = (r + c) % 2 === 1;
                const x = BX + c * CS;
                const y = BY + r * CS;
                
                if (isDark) {
                    const grad = ctx.createLinearGradient(x, y, x + CS, y + CS);
                    grad.addColorStop(0, BIOME.tileA); grad.addColorStop(1, BIOME.tileB);
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, CS, CS);
                    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.strokeRect(x, y, CS, CS);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(x, y, CS, CS);
                }
            }
        }
        
        // Подсветка зоны спавна (нижние 4 ряда)
        ctx.fillStyle = 'rgba(56, 189, 248, 0.05)';
        ctx.fillRect(BX, BY + 4*CS, BOARD, 4*CS);
        
        // Рамка
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(BX - 15, BY - 15, BOARD + 30, BOARD + 30, 20);
        ctx.stroke();

        // Сущности
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.board[r][c]) this.board[r][c].draw(ctx, this.time);
            }
        }
        
        this.playerBase.draw(ctx, this.time);
        this.enemyBase.draw(ctx, this.time);
        
        // Снаряды
        this.projectiles.forEach(p => p.draw(ctx));
        
        // Частицы
        this.particles.forEach(p => p.draw(ctx));
    }
};

// ==========================================
// 6. MAIN LOOP И ЗАПУСК
// ==========================================
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min(0.1, (timestamp - lastTime) / 1000);
    lastTime = timestamp;
    
    if (Game.isRunning) {
        Game.update(dt);
    }
    
    ctx.clearRect(0, 0, W, H);
    Game.draw();
    
    requestAnimationFrame(gameLoop);
}

function startGame(mode) {
    Game.init(mode);
}

// Запуск
Game.board = Array(8).fill(null).map(() => Array(8).fill(null));
Game.playerBase = new BossTower(7, 3, 'player');
Game.enemyBase = new BossTower(0, 3, 'enemy');
requestAnimationFrame(gameLoop);
</script>
